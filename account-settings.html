<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings - DIY Budget Meal Creator</title>

    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="loader.css">
</head>

<body>

    <main class="auth-container">

        <div class="auth-card">

            <div class="logo">
                <h1>Account Settings</h1>
                <p>Manage your DIY Budget Meal Creator account.</p>
            </div>

            <section class="form-section active">

                <h2>Update Email</h2>

                <p class="form-description">
                    Change the email address associated with your account.
                </p>

                <form id="update-email-form">

                    <div class="form-group">
                        <label for="current-email">Current Email</label>
                        <input
                            type="email"
                            id="current-email"
                            readonly
                        >
                    </div>

                    <div class="form-group">
                        <label for="new-email">New Email</label>
                        <input
                            type="email"
                            id="new-email"
                            placeholder="Enter your new email"
                            required
                        >
                    </div>

                    <button type="submit" class="submit-btn">
                        Update Email
                    </button>

                </form>

                <hr style="margin: 30px 0;">

                <h2>Change Password</h2>

                <p class="form-description">
                    Create a new password for your account.
                </p>

                <form id="change-password-form">

                    <div class="form-group">
                        <label for="new-password">New Password</label>
                        <input
                            type="password"
                            id="new-password"
                            minlength="8"
                            placeholder="Enter your new password"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirm New Password</label>
                        <input
                            type="password"
                            id="confirm-password"
                            minlength="8"
                            placeholder="Confirm your new password"
                            required
                        >
                    </div>

                    <button type="submit" class="submit-btn">
                        Change Password
                    </button>

                </form>

                <hr style="margin: 30px 0;">

                <button type="button" id="logout-button" class="submit-btn">
                    Log Out
                </button>

                <p class="toggle-text">
                    <a href="index.html">Return to Homepage</a>
                </p>

            </section>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <script src="account-settings.js"></script>

</body>
</html>

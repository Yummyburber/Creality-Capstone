<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - DIY Budget Meal Creator</title>

    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="loader.css">
</head>

<body>

    <main class="auth-container">

        <div class="auth-card">

            <div class="logo">
                <h1>DIY Budget Meal Creator</h1>
                <p>Choose a new password for your account.</p>
            </div>

            <section class="form-section active">

                <h2>Reset Password</h2>

                <p class="form-description">
                    Enter and confirm your new password below.
                </p>

                <form id="reset-password-form">

                    <div class="form-group">
                        <label for="new-password">New Password</label>
                        <input
                            type="password"
                            id="new-password"
                            placeholder="Enter your new password"
                            minlength="8"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="confirm-new-password">Confirm New Password</label>
                        <input
                            type="password"
                            id="confirm-new-password"
                            placeholder="Confirm your new password"
                            minlength="8"
                            required
                        >
                    </div>

                    <button type="submit" class="submit-btn">
                        Update Password
                    </button>

                </form>

            </section>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>

    <script>
        document.getElementById("reset-password-form").addEventListener("submit", async function (event) {
            event.preventDefault();

            const password = document.getElementById("new-password").value;
            const confirmPassword = document.getElementById("confirm-new-password").value;
            const button = event.target.querySelector(".submit-btn");

            if (password.length < 8) {
                alert("Your password must be at least 8 characters long.");
                return;
            }

            if (password !== confirmPassword) {
                alert("Passwords do not match.");
                return;
            }

            button.disabled = true;
            button.textContent = "Updating...";

            const { error } = await window._supabase.auth.updateUser({
                password: password
            });

            if (error) {
                alert("Unable to update password: " + error.message);
                button.disabled = false;
                button.textContent = "Update Password";
                return;
            }

            alert("Your password has been updated successfully. Please log in again.");

            await window._supabase.auth.signOut();
            window.location.href = "login.html";
        });
    </script>

</body>
</html>
